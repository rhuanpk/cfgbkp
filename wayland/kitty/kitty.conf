# configuration
enable_audio_bell no
cursor_shape underline
shell_integration no-cursor
remember_window_position no
enabled_layouts splits,stack

# customization
font_family family="Hack Nerd Font"
bold_font auto
italic_font auto
bold_italic_font auto
font_size 9

# keybinding > tabs
map ctrl+page_down next_tab
map ctrl+page_up   previous_tab
map alt+ctrl+right next_tab
map alt+ctrl+left  previous_tab

# keybinding > windows
map ctrl+shift+e launch --location=vsplit --cwd=current
map ctrl+shift+o launch --location=hsplit --cwd=current
map ctrl+tab       next_window
map ctrl+shift+tab previous_window
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# keybinding > resize
map ctrl+shift+right resize_window wider
map ctrl+shift+left  resize_window narrower
map ctrl+shift+up    resize_window shorter
map ctrl+shift+down  resize_window taller

# keybinding > full
map ctrl+shift+x toggle_layout stack
